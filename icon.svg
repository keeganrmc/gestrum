<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="108" fill="#0d0f12"/>
  <defs>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background subtle grid -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1c232d" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1c232d" stroke-width="2"/>
  
  <!-- 3x2 Beat Grid Representation -->
  <g filter="url(#bloom)">
    <!-- Top row -->
    <circle cx="160" cy="190" r="32" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="160" cy="190" r="10" fill="#00f0ff"/>
    
    <circle cx="256" cy="170" r="38" fill="none" stroke="#ffd700" stroke-width="4"/>
    <circle cx="256" cy="170" r="14" fill="#ffd700"/>
    
    <circle cx="352" cy="190" r="32" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="352" cy="190" r="10" fill="#00f0ff"/>

    <!-- Bottom row -->
    <circle cx="160" cy="320" r="36" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="160" cy="320" r="12" fill="#00f0ff"/>
    
    <circle cx="256" cy="340" r="42" fill="none" stroke="#ff007f" stroke-width="4"/>
    <circle cx="256" cy="340" r="18" fill="#ff007f"/>
    
    <circle cx="352" cy="320" r="36" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <circle cx="352" cy="320" r="12" fill="#00f0ff"/>
  </g>

  <!-- Luminous Hand Orb -->
  <circle cx="270" cy="245" r="48" fill="url(#glowMagenta)"/>
  <circle cx="270" cy="245" r="12" fill="#ffffff" filter="url(#bloom)"/>
</svg>
